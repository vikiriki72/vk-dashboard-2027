async function open_(pw,save){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(D.s),iterations:IT,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(D.i)},key,b(D.c));
  if(save){try{localStorage.setItem('dvk27',pw)}catch(e){}}
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
